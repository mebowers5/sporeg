name: Docker build
on:
  push: 
    branches: [main, dev]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build_image.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract image version
      run: |
        image_version=$(awk -F'"' '/org\.opencontainers\.image\.version=/ {print $2; exit}' Dockerfile)
        echo "image_version=$image_version" >> "$GITHUB_ENV"

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: mebowers5
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/mebowers5/sporeg:${{ env.image_version }}
          ghcr.io/mebowers5/sporeg:latest